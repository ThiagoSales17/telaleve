name: Linux
on:
  push:
    branches: [main, feat/linux-compat]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Resolve Jammy runner libunwind conflict
        if: matrix.os == 'ubuntu-22.04'
        # The hosted image includes LLVM's libunwind, which conflicts with GStreamer headers.
        # https://github.com/actions/runner-images/issues/9546
        run: |
          packages=$(dpkg-query -W -f='${Package} ${db:Status-Status}\n' 'libunwind-*-dev' 2>/dev/null | awk '$2 == "installed" {print $1}' || true)
          if [ -n "$packages" ]; then sudo apt-get remove -y $packages; fi
      - name: Install native dependencies
        run: ./scripts/install-deps.sh
      - name: Prepare Rust
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy
      - name: Check web and Linux scripts
        run: |
          npm ci
          npm run check
          npm run format:check
          npm run build:web
          npm test
          python3 tests/linux/scripts.test.py
          git diff --exit-code -- web/
      - name: Check Rust and tests
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo test --locked --manifest-path tests/core/Cargo.toml
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Exercise X11 capture
        run: |
          sudo apt-get install -y xvfb xauth
          xvfb-run -a env XDG_SESSION_TYPE=x11 cargo test --locked --manifest-path src-tauri/Cargo.toml -- --include-ignored
          xvfb-run -a --server-args="-screen 0 1280x720x24 -extension RANDR" env XDG_SESSION_TYPE=x11 cargo test --locked --manifest-path src-tauri/Cargo.toml media::integration -- --include-ignored
  distributions:
    strategy:
      fail-fast: false
      matrix:
        image: ['fedora:45', 'archlinux:base-devel', 'opensuse/tumbleweed:latest']
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.image }}
      env:
        PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    timeout-minutes: 30
    steps:
      - name: Prepare checkout tools
        shell: sh
        run: |
          . /etc/os-release
          case "$ID" in
            fedora) dnf install -y git ca-certificates curl ;;
            arch) pacman -Syu --noconfirm git ca-certificates curl ;;
            opensuse*)
              sed -i 's|http://download.opensuse.org|https://download.opensuse.org|g' /etc/zypp/repos.d/*.repo
              zypper clean --all
              for attempt in 1 2 3; do
                if zypper --non-interactive refresh --force; then break; fi
                [ "$attempt" -lt 3 ] || exit 1
                sleep 5
              done
              zypper --non-interactive install git ca-certificates curl
              ;;
          esac
      - uses: actions/checkout@v4
      - name: Install distribution dependencies
        run: ./scripts/install-deps.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare Rust
        shell: sh
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs -o /tmp/telaleve-rustup-init.sh
          sh /tmp/telaleve-rustup-init.sh -y --profile minimal --default-toolchain stable
          printf '%s\n' "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Check sources and native tests
        shell: sh
        run: |
          npm ci
          npm run check
          npm run format:check
          npm run build:web
          npm test
          python3 tests/linux/scripts.test.py
          cargo test --locked --manifest-path src-tauri/Cargo.toml
